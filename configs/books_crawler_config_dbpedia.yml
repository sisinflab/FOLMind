# Knowledge Base Configuration
knowledge_base: "dbpedia"
base_uri: "http://dbpedia.org/resource/"

# Smart Search Service for finding missing URIs
# IMPORTANT NOTE: DBpedia has a rate limit (e.g., 100 queries/min). Using this service may
# require multiple runs to fully populate the mappings due to failed calls.
smart_search_service:
  # If true, uses smart search to generate URIs for items missing from the mapping file.
  # This can be time-consuming but updates the mapping file with new matches.
  use_smart_search: False
  # Keywords to assist the crawler in generating URI candidates. e.g., ['film', 'movie']
  support_keyword_smart_search: ['book', 'novel']
  # The SPARQL class to validate a generated URI. e.g., for movies, check if it 'is a' Film.
  # Example ASK query: ASK WHERE { <uri_generated> a dbo:Film . }
  smart_query: 'a dbo:Book .'
  # SPARQL endpoint for validation queries.
  endpoint : 'http://dbpedia.org/sparql'
  # Number of threads. Keep this low to respect the endpoint's rate limit.
  max_workers: 4
  # Save new mappings to the file after this many successful discoveries.
  save_interval: 100


# Dataset Configuration
dataset:
  url: "http://files.grouplens.org/datasets/book-genome/book-genome.zip"
  data_root: "./data"

# SPARQL Configuration
sparql:
  endpoint: "http://dbpedia.org/sparql"
  templates:
    literaryGenre: >
      PREFIX dbo: <http://dbpedia.org/ontology/>
      SELECT ?s ?o WHERE { ?s dbo:literaryGenre ?o . VALUES ?s { %(values)s } }

  processes: 4
  chunk_size: 20
  max_hops: 1
  hop_categories: ["book"]

# Data Processing Configuration
processing:
  entity_keywords: ["metadata"]
  interaction_keywords: ["ratings"]
  user_keywords:  []

  entity_columns: ["item_id", "url", "title", "authors", "lang", "img", "year", "description"]
  interaction_columns: ["item_id", "user_id", "rating"]
  user_columns: []

  entity_relations:
    - type: multi_value
      subject_col: "kb_uri"
      object_col: "authors"
      predicate: "written_by"
      separator: "|"
    - type: direct
      subject_col: "kb_uri"
      object_col: "year"
      predicate: "published_on"

  interaction_relations:
    - type: conditional
      subject_col: "user_id"
      value_col: "rating"
      object_col: "kb_uri"
      predicate: "likes"
      condition: ">= 3.0"
    - type: conditional
      subject_col: "user_id"
      value_col: "rating"
      object_col: "kb_uri"
      predicate: "dislikes"
      condition: "< 3.0"

# Column Mapping
columns:
  entity_id: "item_id"
  kb_uri: "kb_uri"
  user_id: "user_id"
  rating: "rating"
  fallback_uri: "title"

# Entity Mapping Configuration
mapping:
  file: "data/external_mappings/MappingBookGenome2DBpedia.tsv"
  columns: ["item_id", "title", "kb_uri"]

# Predicate Translation Rules
predicate_mapping:
  dbpedia:
    book:
      literaryGenre: "has_genre"

value_mappings:
  users: {}